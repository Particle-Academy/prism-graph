name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      postgres:
        # Disposable, CI-only database. The tests create and drop their own schemas.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: graph_ci
          POSTGRES_PASSWORD: graph-ci-only
          POSTGRES_DB: graph_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U graph_ci -d graph_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_pgsql, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - name: sqlite-vec (PHP 8.4+, pinned by checksum)
        if: matrix.php == '8.4'
        env:
          SQLITE_VEC_SHA256: b959baa1d8dc88861b1edb337b8587178cdcb12d60b4998f9d10b6a82052d5d7
        run: |
          curl -fsSL -o /tmp/vec.tar.gz https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-linux-x86_64.tar.gz
          echo "${SQLITE_VEC_SHA256}  /tmp/vec.tar.gz" | sha256sum -c -
          mkdir -p /tmp/vec && tar -xzf /tmp/vec.tar.gz -C /tmp/vec
          echo "PRISM_GRAPH_SQLITE_VEC=/tmp/vec/vec0.so" >> "$GITHUB_ENV"
          echo "PRISM_GRAPH_REQUIRE_SQLITE_VEC=1" >> "$GITHUB_ENV"
      - name: Tests (SQLite, sqlite-vec on 8.4, PostgreSQL with pgvector)
        env:
          PRISM_GRAPH_TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=graph_ci
          PRISM_GRAPH_TEST_PG_USER: graph_ci
          PRISM_GRAPH_TEST_PG_PASSWORD: graph-ci-only
          PRISM_GRAPH_REQUIRE_PG: '1'
        run: vendor/bin/phpunit --display-skipped
